# Install as /etc/systemd/journald.conf.d/50-cooldown-persistent.conf (deploy.sh units).
#
# Until 2026-08-12 this file existed only on the box, written by hand and tracked nowhere.
# It is load-bearing — every check that says "in the last N hours" reads what it decides —
# so it belongs in the repo with everything else that survives a reimage.
#
# Raspberry Pi OS ships Storage=volatile (40-rpi-volatile-storage.conf) to spare the SD
# card. Reasonable default, wrong for this box: no logs survive a reboot, so after the
# 2026-08 outage there was no way to answer "did anything happen during those eleven
# days?" -- the honest answer had to be "no records exist", which is not the same thing
# as "nothing happened".
#
# Capped rather than unlimited, because the SD-wear concern is real and is why the
# vendor turned it off.
#
# ON THE TWO SETTINGS THAT LOOK LIKE THEY DO THE SAME THING, because misreading them is
# what hid the problem for two days:
#
#   MaxRetentionSec is a MAXIMUM AGE, not a guaranteed window. It says "delete anything
#   older than this". It never promised a month of history and cannot; on its own it is
#   satisfied by an empty directory.
#
#   SystemMaxUse is what actually determines how far back you can see, because on this
#   box the size cap always binds first. The window is simply cap / write-rate.
#
# Measured 2026-08-12: 4.25 MB/h with /feed forking a sudo per request, which put the
# real window at ~47 hours while this file appeared to promise a month. Moving that read
# onto the scheduler (see sample_acct in app.py) takes the rate to roughly 3.1 MB/h.
#
#   200M / 3.1 MB/h  =  ~2.7 days
#   512M / 3.1 MB/h  =  ~6.9 days   <- sized for the 7-day questions the sweep asks
#
# 512M is 2.2% of the 23G free on this card. If the write rate changes, recompute the
# window rather than assuming this number still buys a week: `journalctl --disk-usage`
# against the timestamp of the oldest entry is the measurement, not this setting.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemMaxFileSize=20M
MaxRetentionSec=1month
SyncIntervalSec=5m
